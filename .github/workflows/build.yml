name: Build Juke3DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Install MP3 library (only if the image doesn't have it)
        run: dkp-pacman -Q 3ds-mpg123 || dkp-pacman -Syu --noconfirm 3ds-mpg123
      - name: Build
        run: make
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: juke3ds
          path: juke3ds.3dsx
