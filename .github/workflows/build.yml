name: Build 3DS app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Install MP3 library
        run: dkp-pacman -Syu --noconfirm 3ds-mpg123
      - name: Build
        run: make
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: musicplayer
          path: musicplayer.3dsx
